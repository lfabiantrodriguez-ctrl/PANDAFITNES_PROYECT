[lector]
; Modo del driver: auto | zkfcom | dp_com
; - zkfcom: ZKTeco ZK4500 / ZK9500 (ZKFingerX / Biokey ActiveX COM)
; - dp_com: DigitalPersona U.are.U (DPFPDevX / DPFPCtlX)
; - auto: detecta automáticamente el SDK instalado en Windows
driver = auto
listen_port = 9090
device_name = LECTOR_USB_RECEPCION

[servidor]
base_url = http://127.0.0.1:3000/api/zk
zk_token = REEMPLAZA_CON_TU_ZK_TOKEN
sync_templates_seconds = 30
