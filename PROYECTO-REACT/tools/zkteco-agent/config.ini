[zkteco]
; IP del reloj ZKTeco en la red local (LAN o Wi-Fi)
ip = 192.168.1.201
port = 4370
password = 0
device_name = ZKTECO_K20_RECEPCION
sincronizar_ultimos_dias = 7
intervalo_segundos = 2

[servidor]
; URL completa del webhook de Panda Fitness
server_url = http://127.0.0.1:3000/api/zk/marcaciones
; Copia el token desde Administración -> Configuración Empresa -> Huellero / ZKTeco
zk_token = REEMPLAZA_CON_TU_ZK_TOKEN

[usb_pendrive]
; Si está en true, detecta memorias USB conectadas a esta PC con attlog.dat y las sube automáticamente
habilitado = true
archivo_nombres = attlog.dat,1_attlog.dat
