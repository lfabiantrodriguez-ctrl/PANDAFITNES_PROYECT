<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Fitness - Autenticación Corp</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: var(--panda-bg-alt);">

    <div class="login-container">
        <div class="login-logo">PANDA<span>FITNESS</span></div>
        <div class="login-tagline">Plataforma de Control Operativo Integral</div>
        
        <form action="dashboard.html" method="GET">
            <div class="form-element">
                <label class="element-label">Rol de Acceso Corporativo</label>
                <select class="input-field" style="height: 45px;" required>
                    <option value="recepcion">Personal de Administración y Recepción</option>
                    <option value="cliente">Socio / Cliente de Sala</option>
                </select>
            </div>
            
            <div class="form-element">
                <label class="element-label">Código de Identidad o DNI</label>
                <input type="text" class="input-field" placeholder="Ingrese credencial" value="72145896" required>
            </div>
            
            <div class="form-element">
                <label class="element-label">Clave Institucional</label>
                <input type="password" class="input-field" placeholder="••••••••" value="******" required>
            </div>
            
            <button type="submit" class="action-btn btn-dark btn-full" style="margin-top: 1rem;">
                Ingresar de Forma Segura
            </button>
        </form>

        <div class="login-footer-academic">
            <strong>Universidad Tecnológica del Perú (UTP)</strong><br>
            Curso: Diseño de Productos y Servicios<br>
            Docente: Mg. Ing. Janett A. Gonzales Flores<br>
            <span style="font-size: 0.75rem; color: #B3B3B3;">Chiclayo — Marzo 2026</span>
        </div>
    </div>

</body>
</html>
